name: Remote Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_DISABLE_AUTH: ${{ vars.VITE_DISABLE_AUTH }}
      VITE_PREVIEW_MODE: 'false'
      VITE_USE_MOCK_DATA: ${{ vars.VITE_USE_MOCK_DATA }}
      HOSTINGER_DEPLOYMENT_MODE: ${{ vars.HOSTINGER_DEPLOYMENT_MODE }}
      HOSTINGER_TARGET_ID: ${{ vars.HOSTINGER_TARGET_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production safety
        if: ${{ inputs.environment == 'production' }}
        run: node scripts/assert-production-safe.mjs
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Validate Hostinger deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${HOSTINGER_DEPLOYMENT_MODE}" != "vps-docker" ]]; then
            echo "Unsupported or missing HOSTINGER_DEPLOYMENT_MODE: ${HOSTINGER_DEPLOYMENT_MODE:-<empty>}. Only vps-docker is enabled until another transport is implemented and tested." >&2
            exit 1
          fi
          if [[ -z "${HOSTINGER_TARGET_ID}" ]]; then
            echo "HOSTINGER_TARGET_ID is required." >&2
            exit 1
          fi
          if [[ -z "${{ secrets.HOSTINGER_API_KEY }}" ]]; then
            echo "HOSTINGER_API_KEY is required." >&2
            exit 1
          fi
      - name: Validate dependency advisories
        run: npm run audit:high
      - run: npm run quality
      - run: npx playwright install --with-deps chromium
      - name: Validate complete staging preview flows
        if: ${{ inputs.environment == 'staging' && vars.VITE_DISABLE_AUTH == 'true' }}
        env:
          VITE_PREVIEW_MODE: 'true'
        run: npx playwright test --grep-invert "production build protects administrative routes"
      - name: Validate public and protected production flows
        if: ${{ inputs.environment == 'production' || vars.VITE_DISABLE_AUTH != 'true' }}
        run: npx playwright test tests/e2e/public.spec.ts
      - name: Link remote Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply remote database migrations
        run: npx supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy remote Edge Functions
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.environment }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_DISABLE_AUTH=${{ vars.VITE_DISABLE_AUTH }}
            VITE_PREVIEW_MODE=false
            VITE_USE_MOCK_DATA=${{ vars.VITE_USE_MOCK_DATA }}
          provenance: true
          sbom: true
      - name: Deploy approved image to Hostinger VPS
        uses: hostinger/deploy-action@v1
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_TARGET_ID }}
          project-name: vivendo-da-musica-${{ inputs.environment }}
          docker-compose-path: docker-compose.hostinger.yml
          environment-variables: |
            APP_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            APP_PORT=${{ vars.HOSTINGER_APP_PORT || '8080' }}
