name: Remove non-dev branches

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/remove-main.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete every branch except dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in main __noop_check__; do
            encoded="${branch//\//%2F}"
            status=$(curl --silent --output /tmp/delete-response --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")
            if [[ "$status" != "204" && "$status" != "422" ]]; then
              cat /tmp/delete-response >&2
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              exit 1
            fi
            echo "Deleted or already absent: ${branch}"
          done
