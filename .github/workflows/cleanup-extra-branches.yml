name: Cleanup Extra Branches

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/cleanup-extra-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and dev
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in dev-preview-static tmp-preview-restore tmp-preview-restore-2; do
            encoded_branch="${branch//\//%2F}"
            status="$(curl -sS -o /tmp/delete-response.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${encoded_branch}")"
            if [ "$status" != "204" ] && [ "$status" != "422" ]; then
              cat /tmp/delete-response.json
              echo "Failed deleting ${branch}: HTTP ${status}" >&2
              exit 1
            fi
            echo "Deleted or already absent: ${branch}"
          done
