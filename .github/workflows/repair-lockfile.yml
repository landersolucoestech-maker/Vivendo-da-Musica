name: Repair Lockfile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/audit-high.mjs
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only || true
      - name: Validate high severity audit
        run: npm run audit:high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
