name: One-time branch cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove obsolete non-dev branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "dev-preview-static"
            "feat/engineering-os-runtime"
            "dependabot/npm_and_yarn/hookform/resolvers-5.9.1"
            "dependabot/npm_and_yarn/eslint-10.9.1"
            "dependabot/npm_and_yarn/lucide-react-1.37.0"
            "dependabot/npm_and_yarn/recharts-3.10.1"
            "dependabot/npm_and_yarn/sonner-2.0.8"
            "dependabot/npm_and_yarn/tailwind-merge-3.6.0"
            "dependabot/npm_and_yarn/typescript-7.0.2"
            "dependabot/npm_and_yarn/zod-4.5.4"
          )
          for branch in "${branches[@]}"; do
            encoded_branch="${branch//\//%2F}"
            status=$(curl --silent --output /tmp/delete-response --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}")
            if [[ "$status" != "204" && "$status" != "422" ]]; then
              cat /tmp/delete-response >&2
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              exit 1
            fi
            echo "Deleted or already absent: ${branch}"
          done
