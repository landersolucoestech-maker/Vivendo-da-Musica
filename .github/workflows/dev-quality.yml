name: Dev Quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: dev-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_DISABLE_AUTH: "true"
      VITE_USE_MOCK_DATA: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance gate
        run: npm run test:performance

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_CLI_VERSION: 2.111.0
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prepare database tooling
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          timeout --signal=TERM --kill-after=30s 3m \
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version

      - name: Start local Postgres with bounded retry
        shell: bash
        run: |
          set -uo pipefail

          print_diagnostics() {
            echo "::group::Docker diagnostics"
            docker ps -a || true
            docker images || true
            docker system df || true
            df -h || true
            echo "::endgroup::"
          }

          for attempt in 1 2 3; do
            echo "Starting local Supabase Postgres — attempt ${attempt}/3"

            if timeout --signal=TERM --kill-after=30s 7m \
              npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start; then
              npx --yes "supabase@${SUPABASE_CLI_VERSION}" status || true
              exit 0
            fi

            exit_code=$?
            echo "Attempt ${attempt} failed or timed out with exit code ${exit_code}."
            print_diagnostics

            timeout --signal=TERM --kill-after=30s 2m \
              npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true

            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo "Unable to start local Postgres after three bounded attempts."
          exit 1

      - name: Rebuild local database
        run: timeout --signal=TERM --kill-after=30s 10m npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --local

      - name: Lint local database
        run: timeout --signal=TERM --kill-after=30s 5m npx --yes "supabase@${SUPABASE_CLI_VERSION}" db lint --local

      - name: Run pgTAP database tests
        run: timeout --signal=TERM --kill-after=30s 8m npx --yes "supabase@${SUPABASE_CLI_VERSION}" test db --local

      - name: Stop local Supabase
        if: always()
        run: timeout --signal=TERM --kill-after=30s 2m npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
