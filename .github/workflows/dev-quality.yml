name: Dev Quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: dev-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_DISABLE_AUTH: "true"
      VITE_USE_MOCK_DATA: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance gate
        run: npm run test:performance

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_CLI_VERSION: 2.111.0
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start local Postgres with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Starting local Supabase Postgres — attempt ${attempt}/4"
            if npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start; then
              exit 0
            fi

            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
            if [ "${attempt}" -eq 4 ]; then
              echo "Unable to start local Postgres after four attempts."
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Rebuild local database
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --local

      - name: Lint local database
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db lint --local

      - name: Run pgTAP database tests
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" test db --local

      - name: Stop local Supabase
        if: always()
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
