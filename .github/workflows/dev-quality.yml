name: Dev Quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: dev-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_DISABLE_AUTH: "true"
      VITE_USE_MOCK_DATA: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance gate
        run: npm run test:performance

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_CLI_VERSION: 2.111.0
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/supabase_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/supabase-cli"
          mkdir -p "${install_dir}"

          for attempt in 1 2 3; do
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
              --output "${archive}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error title=Supabase CLI unavailable::Could not download pinned Supabase CLI v${SUPABASE_CLI_VERSION}."
              exit 1
            fi
            sleep $((attempt * 10))
          done

          tar -xzf "${archive}" -C "${install_dir}"
          chmod +x "${install_dir}/supabase"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/supabase" --version

      - name: Container runtime and registry preflight
        id: registry_preflight
        shell: bash
        run: |
          set -euo pipefail

          check_registry() {
            local name="$1"
            local url="$2"
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 15 --max-time 45 "${url}" || true)"
            case "${status}" in
              200|401)
                echo "${name}: reachable (HTTP ${status})"
                ;;
              *)
                echo "${name}: unavailable or TLS/DNS failure (HTTP ${status:-none})"
                return 1
                ;;
            esac
          }

          docker info > "${RUNNER_TEMP}/docker-info.txt"
          docker version

          registry_ok=true
          check_registry "Docker Hub" "https://registry-1.docker.io/v2/" || registry_ok=false
          check_registry "GitHub Container Registry" "https://ghcr.io/v2/" || registry_ok=false

          {
            echo "## Database container preflight"
            echo
            echo "- Docker daemon: available"
            echo "- External registries reachable: ${registry_ok}"
            echo "- Supabase CLI: $(supabase --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "registry_ok=${registry_ok}" >> "${GITHUB_OUTPUT}"

      - name: Start local Postgres with bounded retry
        id: db_start
        shell: bash
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/supabase-db-start.log"
          : > "${log_file}"
          echo "db_started=false" >> "${GITHUB_OUTPUT}"

          print_diagnostics() {
            echo "::group::Docker diagnostics"
            docker ps -a || true
            docker images || true
            docker system df || true
            df -h || true
            echo "::endgroup::"
          }

          clean_partial_database_runtime() {
            docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true
            docker network ls -q --filter "name=supabase" | xargs -r docker network rm || true
            docker volume ls -q --filter "name=supabase" | xargs -r docker volume rm -f || true
            docker container prune --force || true
          }

          for attempt in 1 2 3; do
            echo "Starting local Postgres — attempt ${attempt}/3"
            attempt_log="${RUNNER_TEMP}/supabase-db-start-attempt-${attempt}.log"

            set +e
            timeout --signal=TERM --kill-after=30s 8m \
              supabase db start --debug 2>&1 | tee "${attempt_log}"
            exit_code=${PIPESTATUS[0]}
            set -e
            cat "${attempt_log}" >> "${log_file}"

            if [ "${exit_code}" -eq 0 ]; then
              echo "db_started=true" >> "${GITHUB_OUTPUT}"
              supabase status || true
              {
                echo "## Local database gate"
                echo
                echo "- Local Postgres started successfully on attempt ${attempt}."
                echo "- Only the database service was started because reset, lint and pgTAP do not require the complete Supabase stack."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            echo "Attempt ${attempt} failed or timed out with exit code ${exit_code}."
            print_diagnostics
            clean_partial_database_runtime

            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done

          failure_class="supabase_database_startup"
          if grep -Eqi 'x509: certificate signed by unknown authority|TLS handshake timeout|failed to copy|failed to download docker image|toomanyrequests|connection reset by peer|temporary failure in name resolution' "${log_file}"; then
            failure_class="external_container_registry"
          elif grep -Eqi 'invalid reference format|manifest unknown|no matching manifest' "${log_file}"; then
            failure_class="container_image_reference"
          elif grep -Eqi 'port is already allocated|address already in use' "${log_file}"; then
            failure_class="runner_port_conflict"
          fi

          echo "failure_class=${failure_class}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Local database gate blocked"
            echo
            echo "- Failure class: \`${failure_class}\`"
            echo "- Registry preflight passed: \`${{ steps.registry_preflight.outputs.registry_ok }}\`"
            echo "- Database reset, SQL lint and pgTAP were **not executed**."
            echo "- The job remains failed intentionally; no skipped database validation is reported as success."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error title=Local database validation blocked::Postgres could not start after three bounded attempts (${failure_class}). Database reset, lint and pgTAP were not executed."
          exit 1

      - name: Expose database startup diagnostics
        if: failure() && steps.db_start.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Supabase database startup log"
            echo
            echo '```text'
            if [ -f "${RUNNER_TEMP}/supabase-db-start.log" ]; then
              tail -n 300 "${RUNNER_TEMP}/supabase-db-start.log"
            else
              echo "supabase-db-start.log was not created"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload database startup diagnostics
        if: failure() && steps.db_start.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-db-start-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/supabase-db-start.log
            ${{ runner.temp }}/supabase-db-start-attempt-*.log
            ${{ runner.temp }}/docker-info.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Rebuild local database
        if: steps.db_start.outputs.db_started == 'true'
        run: timeout --signal=TERM --kill-after=30s 12m supabase db reset --local

      - name: Lint local database
        if: steps.db_start.outputs.db_started == 'true'
        run: timeout --signal=TERM --kill-after=30s 6m supabase db lint --local --level warning --fail-on error

      - name: Run pgTAP database tests
        if: steps.db_start.outputs.db_started == 'true'
        run: timeout --signal=TERM --kill-after=30s 10m supabase test db --local

      - name: Stop local database
        if: always() && steps.db_start.outputs.db_started == 'true'
        continue-on-error: true
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=30s 3m supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true
          docker network ls -q --filter "name=supabase" | xargs -r docker network rm || true
          docker volume ls -q --filter "name=supabase" | xargs -r docker volume rm -f || true
