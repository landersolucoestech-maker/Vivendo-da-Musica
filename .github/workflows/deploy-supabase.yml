name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      apply_migrations:
        description: Aplicar migrations antes das funções
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DEV_SUPABASE_PROJECT_REF: ywirfqvobfnunlcsnptm

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate source branch
        run: |
          if [ "${{ inputs.environment }}" = "dev" ] && [ "$GITHUB_REF_NAME" != "dev" ]; then
            echo "O deploy do ambiente dev deve ser executado a partir da branch dev."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve target project
        env:
          CONFIGURED_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            echo "SUPABASE_PROJECT_REF=${DEV_SUPABASE_PROJECT_REF}" >> "$GITHUB_ENV"
          else
            test -n "$CONFIGURED_PROJECT_REF"
            echo "SUPABASE_PROJECT_REF=${CONFIGURED_PROJECT_REF}" >> "$GITHUB_ENV"
          fi

      - name: Validate target secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          if [ "${{ inputs.apply_migrations }}" = "true" ]; then test -n "$SUPABASE_DB_PASSWORD"; fi
          if [ "${{ inputs.environment }}" = "dev" ] && [ "$SUPABASE_PROJECT_REF" != "$DEV_SUPABASE_PROJECT_REF" ]; then
            echo "O ambiente dev deve usar o projeto ${DEV_SUPABASE_PROJECT_REF}."
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "production" ] && [ "$SUPABASE_PROJECT_REF" = "$DEV_SUPABASE_PROJECT_REF" ]; then
            echo "O projeto de desenvolvimento não pode ser usado em produção."
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: ${{ inputs.apply_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-supabase-functions.mjs
