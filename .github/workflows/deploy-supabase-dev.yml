name: Deploy Supabase Dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/deploy-dev-trigger

permissions:
  contents: read

concurrency:
  group: supabase-dev
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ywirfqvobfnunlcsnptm
  SUPABASE_PROJECT_URL: https://ywirfqvobfnunlcsnptm.supabase.co

jobs:
  deploy:
    name: Migrations and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev"

      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          grep --quiet "project_id = \"${SUPABASE_PROJECT_REF}\"" supabase/config.toml
          node scripts/verify-dev-supabase-target.mjs

      - name: Link development project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply all database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify linked migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-supabase-functions.mjs

      - name: Verify deployed API health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${SUPABASE_PROJECT_URL}/functions/v1/api-v1/v1/health"
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 20 "$health_url")" \
              && printf '%s' "$response" | grep --quiet '"status":"healthy"'; then
              printf '%s\n' "$response"
              {
                echo "## Supabase DEV deployment"
                echo
                echo "- Project: \`${SUPABASE_PROJECT_REF}\`"
                echo "- Migrations: applied"
                echo "- Edge Functions: deployed"
                echo "- API health: healthy"
                echo "- Source commit: \`${GITHUB_SHA}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Supabase DEV health check failed::api-v1 did not become healthy after deployment."
          exit 1
