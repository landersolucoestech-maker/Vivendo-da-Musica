name: Neutralize Legacy Vercel Status

on:
  push:
    branches: [dev]
  status:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: neutralize-legacy-vercel-${{ github.event.sha || github.sha }}
  cancel-in-progress: true

jobs:
  neutralize:
    name: Mark legacy Vercel integration as non-blocking
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' && github.event.state == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.sha || github.sha }}
      PAGES_URL: https://landersolucoestech-maker.github.io/Vivendo-da-Musica/
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Replace legacy Vercel failure status
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error --location \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              --data "$(jq -n \
                --arg state success \
                --arg context Vercel \
                --arg description 'Legacy Vercel disabled; GitHub Pages is canonical' \
                --arg target_url "$PAGES_URL" \
                '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          )"

          if [[ "$http_code" != "201" ]]; then
            cat "$response_file"
            echo "GitHub status API returned HTTP ${http_code}." >&2
            exit 1
          fi

          jq '{state, context, description, target_url, sha}' "$response_file"
