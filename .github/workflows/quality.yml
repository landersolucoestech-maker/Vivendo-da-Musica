name: Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
  VITE_DISABLE_AUTH: 'true'
  VITE_USE_MOCK_DATA: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE_PATH: /functions/v1/vivendo-preview/
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:performance

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_PREVIEW_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
