name: Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
  VITE_DISABLE_AUTH: 'true'
  VITE_USE_MOCK_DATA: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE_PATH: /functions/v1/vivendo-preview/
      - uses: actions/upload-artifact@v7
        with:
          name: vercel-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:performance

  e2e-preview:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_PREVIEW_MODE: 'true'
      VITE_DISABLE_AUTH: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate all non-authenticated preview flows
        run: npx playwright test --grep-invert "production build protects administrative routes"

  e2e-auth-guard:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PREVIEW_MODE: 'false'
      VITE_DISABLE_AUTH: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate protected route redirect without changing authentication
        run: npx playwright test tests/e2e/public.spec.ts --grep "production build protects administrative routes"

  deploy-supabase-dev:
    needs: [quality, e2e-preview, e2e-auth-guard]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      contains(toJSON(github.event.head_commit), '.github/deploy-dev-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      SUPABASE_PROJECT_REF: ywirfqvobfnunlcsnptm
      SUPABASE_PROJECT_URL: https://ywirfqvobfnunlcsnptm.supabase.co
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment credentials and target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          grep --quiet "project_id = \"${SUPABASE_PROJECT_REF}\"" supabase/config.toml
          node scripts/verify-dev-supabase-target.mjs

      - name: Link Supabase DEV project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply all remote migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Verify linked migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-supabase-functions.mjs

      - name: Verify remote API health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${SUPABASE_PROJECT_URL}/functions/v1/api-v1/v1/health"
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 20 "$health_url")" \
              && printf '%s' "$response" | grep --quiet '"status":"healthy"'; then
              printf '%s\n' "$response"
              {
                echo "## Supabase DEV deployment"
                echo
                echo "- Project: \`${SUPABASE_PROJECT_REF}\`"
                echo "- Migrations: applied"
                echo "- Edge Functions: deployed"
                echo "- API health: healthy"
                echo "- Source commit: \`${GITHUB_SHA}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Supabase DEV health check failed::api-v1 did not become healthy after deployment."
          exit 1
