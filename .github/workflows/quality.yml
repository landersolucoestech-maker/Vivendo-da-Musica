name: Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
  VITE_DISABLE_AUTH: 'true'
  VITE_USE_MOCK_DATA: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:high
      - run: npm run typecheck
      - run: npm run lint
      - name: Validate deployment provider policy
        run: npm run test:deployment-provider
      - name: Validate Agentic Engineering OS
        run: npm run test:agentic
      - run: npm run test
      - run: npm run build
        env:
          VITE_BASE_PATH: /functions/v1/vivendo-preview/
      - uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:performance

  e2e-preview:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_PREVIEW_MODE: 'true'
      VITE_DISABLE_AUTH: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate all non-authenticated preview flows
        run: npx playwright test --grep-invert "production build protects administrative routes"

  e2e-auth-guard:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PREVIEW_MODE: 'false'
      VITE_DISABLE_AUTH: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate protected route redirect without changing authentication
        run: npx playwright test tests/e2e/public.spec.ts --grep "production build protects administrative routes"

  deploy-supabase-dev:
    needs: [quality, e2e-preview, e2e-auth-guard]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    env:
      SUPABASE_PROJECT_REF: ywirfqvobfnunlcsnptm
      SUPABASE_PROJECT_URL: https://ywirfqvobfnunlcsnptm.supabase.co
    steps:
      - name: Checkout dev history
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 2

      - name: Detect controlled deployment trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^ HEAD -- .github/deploy-dev-trigger; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment marker did not change in the latest dev commit."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment marker changed; remote deployment authorized."
          fi

      - name: Setup Node.js
        if: steps.trigger.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.deploy == 'true'
        run: npm ci

      - name: Validate deployment credential and target
        if: steps.trigger.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          grep --quiet "project_id = \"${SUPABASE_PROJECT_REF}\"" supabase/config.toml
          node scripts/verify-dev-supabase-target.mjs

      - name: Link Supabase DEV project
        if: steps.trigger.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Reconcile schema and migration history
        if: steps.trigger.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/reconcile-supabase-dev-history.sh

      - name: Upload Supabase reconciliation diagnostics
        if: always() && steps.trigger.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-dev-reconciliation-${{ github.run_id }}
          path: artifacts/supabase-dev
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy all Edge Functions
        if: steps.trigger.outputs.deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-supabase-functions.mjs

      - name: Upload Edge Function deployment diagnostics
        if: always() && steps.trigger.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-edge-functions-${{ github.run_id }}
          path: artifacts/supabase-functions
          if-no-files-found: warn
          retention-days: 7

      - name: Verify remote API health
        if: steps.trigger.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          health_url="${SUPABASE_PROJECT_URL}/functions/v1/api-v1/v1/health"
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 20 "$health_url")" \
              && printf '%s' "$response" | grep --quiet '"status":"healthy"'; then
              printf '%s\n' "$response"
              {
                echo "## Supabase DEV deployment"
                echo
                echo "- Project: \`${SUPABASE_PROJECT_REF}\`"
                echo "- Schema and migration history: reconciled"
                echo "- Edge Functions: deployed"
                echo "- API health: healthy"
                echo "- Source commit: \`${GITHUB_SHA}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Supabase DEV health check failed::api-v1 did not become healthy after deployment."
          exit 1
