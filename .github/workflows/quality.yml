name: Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key-placeholder
  VITE_DISABLE_AUTH: 'true'
  VITE_USE_MOCK_DATA: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:performance

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
