name: Dev Static Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-static-preview-${{ github.event_name }}
  cancel-in-progress: true

env:
  STATIC_BRANCH: dev-preview-static
  STATIC_BASE_PATH: /landersolucoestech-maker/Vivendo-da-Musica/dev-preview-static/
  STATIC_PREVIEW_URL: https://raw.githack.com/landersolucoestech-maker/Vivendo-da-Musica/dev-preview-static/index.html

jobs:
  publish:
    name: Build and publish dev preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: /landersolucoestech-maker/Vivendo-da-Musica/dev-preview-static/
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build hosted preview
        run: npm run build

      - name: Normalize static entry and add fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('dist/index.html')
          content = index.read_text(encoding='utf-8')
          normalizer = """<script>
            if (window.location.pathname.endsWith('/index.html')) {
              window.history.replaceState(null, '', window.location.pathname.slice(0, -10) + window.location.search + window.location.hash);
            }
          </script>"""
          content = content.replace('<head>', '<head>\n    ' + normalizer, 1)
          index.write_text(content, encoding='utf-8')
          Path('dist/404.html').write_text(content, encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY

      - name: Upload compiled preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-static-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish static branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init --initial-branch="${STATIC_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(preview): publish ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${STATIC_BRANCH}"

  verify:
    name: Verify published dev preview
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: https://raw.githack.com/landersolucoestech-maker/Vivendo-da-Musica/dev-preview-static/index.html
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Wait for static host
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${PREVIEW_URL}?commit=${GITHUB_SHA}" --output /tmp/preview.html \
              && grep --quiet "Vivendo da Música" /tmp/preview.html; then
              exit 0
            fi
            sleep 4
          done
          echo "A hospedagem estática não disponibilizou o build dentro do prazo." >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify visible Home
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/preview-audit
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const url = `${process.env.PREVIEW_URL}?commit=${process.env.COMMIT_SHA}`;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          const failedAssets = [];

          page.on('pageerror', (error) => pageErrors.push(error.message));
          page.on('requestfailed', (request) => {
            if (['script', 'stylesheet', 'document'].includes(request.resourceType())) {
              failedAssets.push(`${request.resourceType()} ${request.url()} — ${request.failure()?.errorText ?? 'failed'}`);
            }
          });

          const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45_000 });
          await page.waitForFunction(() => document.querySelector('#root')?.childElementCount > 0, undefined, { timeout: 30_000 });
          await page.waitForTimeout(2_000);

          const snapshot = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body.innerText.trim(),
            rootChildCount: document.querySelector('#root')?.childElementCount ?? 0,
            scriptCount: Array.from(document.scripts).filter((script) => Boolean(script.src)).length,
            stylesheetCount: document.querySelectorAll('link[rel="stylesheet"]').length,
            path: window.location.pathname,
          }));

          await page.screenshot({ path: 'artifacts/preview-audit/home.png', fullPage: true });
          const report = {
            url,
            status: response?.status() ?? 0,
            ...snapshot,
            bodyTextLength: snapshot.bodyText.length,
            pageErrors,
            failedAssets,
          };
          await writeFile('artifacts/preview-audit/report.json', JSON.stringify(report, null, 2));

          const failures = [];
          if (report.status !== 200) failures.push(`HTTP ${report.status}`);
          if (report.rootChildCount === 0) failures.push('React não montou conteúdo no #root.');
          if (report.bodyTextLength < 100) failures.push(`Conteúdo visível insuficiente: ${report.bodyTextLength} caracteres.`);
          if (report.scriptCount === 0 || report.stylesheetCount === 0) failures.push('Bundles JavaScript ou CSS ausentes.');
          if (report.bodyText.includes('Não foi possível abrir a plataforma')) failures.push('Fallback fatal de inicialização foi exibido.');
          if (report.bodyText.includes('Carregando Vivendo da Música')) failures.push('Aplicação permaneceu presa no bootstrap.');
          if (pageErrors.length > 0) failures.push(`Erros JavaScript: ${pageErrors.join(' | ')}`);
          if (failedAssets.length > 0) failures.push(`Assets críticos falharam: ${failedAssets.join(' | ')}`);

          await browser.close();
          if (failures.length > 0) throw new Error(failures.join('\n'));
          console.log(JSON.stringify(report, null, 2));
          JS

      - name: Upload preview audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-preview-audit-${{ github.sha }}
          path: artifacts/preview-audit
          if-no-files-found: error
          retention-days: 14
