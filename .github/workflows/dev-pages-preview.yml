name: Dev Static Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-static-preview-${{ github.event_name }}
  cancel-in-progress: true

env:
  STATIC_BRANCH: dev-preview-static
  ASSET_BASE: https://cdn.jsdelivr.net/gh/landersolucoestech-maker/Vivendo-da-Musica@dev-preview-static/

jobs:
  publish:
    name: Build and publish dev preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_sha: ${{ steps.build_ref.outputs.sha }}
      static_sha: ${{ steps.publish_ref.outputs.sha }}
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: https://cdn.jsdelivr.net/gh/landersolucoestech-maker/Vivendo-da-Musica@dev-preview-static/
      VITE_ROUTER_MODE: hash
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve build commit
        id: build_ref
        run: |
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=${BUILD_SHA}" >> "${GITHUB_ENV}"
          echo "sha=${BUILD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build hosted preview
        run: npm run build

      - name: Stamp and validate build
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace(
              '<head>',
              f'<head>\n    <meta name="vdm-preview-commit" content="{os.environ["BUILD_SHA"]}" />',
              1,
          )
          index.write_text(html, encoding='utf-8')
          Path('dist/404.html').write_text(html, encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" dist/index.html
          grep --quiet "${ASSET_BASE}assets/" dist/index.html
          grep --quiet '<div id="root"></div>' dist/index.html

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-static-preview-${{ steps.build_ref.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable static commit
        id: publish_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init --initial-branch="${STATIC_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(preview): publish ${BUILD_SHA}"
          STATIC_SHA=$(git rev-parse HEAD)
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${STATIC_BRANCH}"
          echo "sha=${STATIC_SHA}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify executable dev preview
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUILD_SHA: ${{ needs.publish.outputs.build_sha }}
      STATIC_SHA: ${{ needs.publish.outputs.static_sha }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Validate HTML and bundle delivery
        run: |
          PREVIEW_URL="https://cdn.githubraw.com/${GITHUB_REPOSITORY}/${STATIC_SHA}/index.html"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --dump-header /tmp/preview.headers \
              "${PREVIEW_URL}" --output /tmp/preview.html \
              && grep --quiet "vdm-preview-commit.*${BUILD_SHA}" /tmp/preview.html \
              && grep --quiet '<div id="root"></div>' /tmp/preview.html; then
              break
            fi
            sleep 4
          done
          cat /tmp/preview.headers
          grep -Ei '^content-type:.*text/html' /tmp/preview.headers
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" /tmp/preview.html
          ASSET_URL=$(grep -o 'src="https://cdn.jsdelivr.net/[^"]*\.js"' /tmp/preview.html | head -1 | cut -d'"' -f2)
          test -n "${ASSET_URL}"
          curl --fail --silent --show-error --dump-header /tmp/asset.headers "${ASSET_URL}" --output /tmp/main.js
          grep -Ei '^content-type:.*(javascript|ecmascript)' /tmp/asset.headers
          test -s /tmp/main.js

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify React rendering and navigation
        run: |
          mkdir -p artifacts/preview-audit
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          const failedAssets = [];
          const consoleErrors = [];

          page.on('pageerror', (error) => pageErrors.push(error.message));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('requestfailed', (request) => {
            if (['script', 'stylesheet', 'document'].includes(request.resourceType())) {
              failedAssets.push(`${request.resourceType()} ${request.url()} — ${request.failure()?.errorText ?? 'failed'}`);
            }
          });

          const response = await page.goto(process.env.PREVIEW_URL, {
            waitUntil: 'domcontentloaded',
            timeout: 45_000,
          });
          await page.waitForFunction(
            () => document.querySelector('#root')?.childElementCount > 0,
            undefined,
            { timeout: 30_000 },
          );
          await page.waitForTimeout(2_000);

          const home = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body.innerText.trim(),
            rootChildCount: document.querySelector('#root')?.childElementCount ?? 0,
            scriptCount: Array.from(document.scripts).filter((script) => Boolean(script.src)).length,
            stylesheetCount: document.querySelectorAll('link[rel="stylesheet"]').length,
            commit: document.querySelector('meta[name="vdm-preview-commit"]')?.getAttribute('content') ?? '',
          }));

          await page.evaluate(() => {
            window.location.hash = '#/cursos';
          });
          await page.waitForFunction(() => window.location.hash === '#/cursos', undefined, { timeout: 10_000 });
          await page.waitForTimeout(1_000);

          const navigation = await page.evaluate(() => ({
            hash: window.location.hash,
            bodyTextLength: document.body.innerText.trim().length,
            rootChildCount: document.querySelector('#root')?.childElementCount ?? 0,
          }));

          await page.screenshot({ path: 'artifacts/preview-audit/home.png', fullPage: true });
          const report = {
            url: process.env.PREVIEW_URL,
            status: response?.status() ?? 0,
            home: { ...home, bodyTextLength: home.bodyText.length },
            navigation,
            pageErrors,
            failedAssets,
            consoleErrors,
          };
          await writeFile('artifacts/preview-audit/report.json', JSON.stringify(report, null, 2));

          const failures = [];
          if (report.status !== 200) failures.push(`HTTP ${report.status}`);
          if (home.commit !== process.env.BUILD_SHA) failures.push(`Build inesperado: ${home.commit}`);
          if (home.rootChildCount === 0 || home.bodyText.length < 100) failures.push('A Home não renderizou conteúdo suficiente.');
          if (home.scriptCount === 0 || home.stylesheetCount === 0) failures.push('Bundles JavaScript ou CSS ausentes.');
          if (home.bodyText.includes('Não foi possível abrir a plataforma')) failures.push('Fallback fatal foi exibido.');
          if (home.bodyText.includes('Carregando Vivendo da Música')) failures.push('Aplicação permaneceu no bootstrap.');
          if (navigation.hash !== '#/cursos' || navigation.rootChildCount === 0 || navigation.bodyTextLength < 100) {
            failures.push('Navegação interna por hash falhou.');
          }
          if (pageErrors.length > 0) failures.push(`Erros JavaScript: ${pageErrors.join(' | ')}`);
          if (failedAssets.length > 0) failures.push(`Assets críticos falharam: ${failedAssets.join(' | ')}`);

          await browser.close();
          console.log(JSON.stringify(report, null, 2));
          if (failures.length > 0) throw new Error(failures.join('\n'));
          JS

      - name: Upload preview audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-preview-audit-${{ needs.publish.outputs.build_sha }}
          path: artifacts/preview-audit
          if-no-files-found: warn
          retention-days: 14
