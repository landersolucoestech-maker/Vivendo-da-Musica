name: Dev Pages Preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dev-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build dev preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: /Vivendo-da-Musica/
      VITE_ROUTER_MODE: hash
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Agentic Engineering OS
        run: npm run test:agentic

      - name: Typecheck
        run: npm run typecheck

      - name: Build dev preview
        run: npm run build

      - name: Harden Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Source maps are forbidden in the public development preview.' >&2
            exit 1
          fi
          if grep -R -E -n 'SUPABASE_SERVICE_ROLE_KEY|STRIPE_[A-Z_]*SECRET|PRIVATE KEY' dist; then
            echo 'Potential secret marker found in public preview artifact.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import os
          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          sha = os.environ['GITHUB_SHA']
          metadata = '\n    '.join([
              '<meta name="vdm-preview-branch" content="dev" />',
              f'<meta name="vdm-preview-commit" content="{sha}" />',
              '<meta name="robots" content="noindex, nofollow, noarchive" />',
              '<meta name="googlebot" content="noindex, nofollow, noarchive" />',
          ])
          html = html.replace('<head>', f'<head>\n    {metadata}', 1)
          index.write_text(html, encoding='utf-8')
          Path('dist/404.html').write_text(html, encoding='utf-8')
          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY
          grep --quiet '^Disallow: /$' dist/robots.txt
          grep --quiet 'vdm-preview-branch" content="dev"' dist/index.html
          grep --quiet "vdm-preview-commit\" content=\"${GITHUB_SHA}\"" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy dev to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
