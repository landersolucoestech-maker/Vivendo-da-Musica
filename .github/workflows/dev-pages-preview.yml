name: Dev Pages Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dev-pages-preview-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview artifact
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: /Vivendo-da-Musica/
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build hosted preview
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy dev preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live dev preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify published application
        run: node scripts/verify-pages-preview.mjs

      - name: Upload preview audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-preview-audit-${{ github.sha }}
          path: artifacts/preview-audit
          if-no-files-found: warn
          retention-days: 14
