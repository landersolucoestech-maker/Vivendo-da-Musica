name: Dev Preview Static

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-preview-static
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish dev preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: ./
      VITE_ROUTER_MODE: browser
      STATIC_BRANCH: dev-preview-static
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve build commit
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build

      - name: Stamp and validate compiled preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          stamp = f'<meta name="vdm-preview-commit" content="{os.environ["BUILD_SHA"]}" />'
          html = html.replace('<head>', f'<head>\n    {stamp}', 1)
          index.write_text(html, encoding='utf-8')
          Path('dist/404.html').write_text(html, encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY

          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" dist/index.html
          grep --quiet '<div id="root"></div>' dist/index.html

          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Source maps are not allowed in the public preview artifact.' >&2
            exit 1
          fi

          if grep -RIE --binary-files=without-match \
            'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_PASSWORD|STRIPE_[A-Z_]*SECRET|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            dist; then
            echo 'A server-side secret marker was found in the public preview artifact.' >&2
            exit 1
          fi

      - name: Publish compiled static branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          trap 'rm -rf "$publish_dir"' EXIT
          cp -a dist/. "$publish_dir"/

          git -C "$publish_dir" init --initial-branch="$STATIC_BRANCH"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" add -A
          git -C "$publish_dir" commit -m "chore(preview): publish ${BUILD_SHA}"
          git -C "$publish_dir" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$publish_dir" push --force origin \
            "HEAD:refs/heads/${STATIC_BRANCH}"

      - name: Verify published commit marker
        shell: bash
        run: |
          set -euo pipefail
          raw_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${STATIC_BRANCH}/index.html"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${raw_url}?build=${BUILD_SHA}" \
              | grep --quiet "vdm-preview-commit.*${BUILD_SHA}"; then
              echo "Published preview verified for ${BUILD_SHA}."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "The published preview does not contain ${BUILD_SHA}." >&2
          exit 1

      - name: Upload compiled preview diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: dev-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
