name: Dev Static Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-static-preview-${{ github.event_name }}
  cancel-in-progress: true

env:
  STATIC_BRANCH: dev-preview-static

jobs:
  publish:
    name: Build and publish dev preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_sha: ${{ steps.build_ref.outputs.sha }}
      static_sha: ${{ steps.publish_ref.outputs.sha }}
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: ./
      VITE_ROUTER_MODE: hash
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve build commit
        id: build_ref
        run: |
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=${BUILD_SHA}" >> "${GITHUB_ENV}"
          echo "sha=${BUILD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Force preview HashRouter
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          source = app.read_text(encoding='utf-8')
          current = "const Router = import.meta.env.VITE_ROUTER_MODE === 'hash' ? HashRouter : BrowserRouter;"
          replacement = "const Router = document.querySelector('meta[name=\"vdm-preview-commit\"]') ? HashRouter : BrowserRouter;"
          if current not in source:
              raise SystemExit('A seleção esperada do Router não foi encontrada em src/App.tsx.')
          app.write_text(source.replace(current, replacement, 1), encoding='utf-8')
          PY

      - name: Build hosted preview
        run: npm run build

      - name: Stamp and validate build
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          preview_bootstrap = (
              f'<meta name="vdm-preview-commit" content="{os.environ["BUILD_SHA"]}" />\n'
              '    <script>if (!window.location.hash) history.replaceState(null, "", window.location.pathname + window.location.search + "#/");</script>'
          )
          html = html.replace('<head>', f'<head>\n    {preview_bootstrap}', 1)
          index.write_text(html, encoding='utf-8')
          Path('dist/404.html').write_text(html, encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" dist/index.html
          grep --quiet 'window.location.hash' dist/index.html
          grep --quiet 'src="./assets/' dist/index.html
          grep --quiet 'href="./assets/' dist/index.html
          grep --quiet '<div id="root"></div>' dist/index.html

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-static-preview-${{ steps.build_ref.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable static commit
        id: publish_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init --initial-branch="${STATIC_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(preview): publish ${BUILD_SHA}"
          STATIC_SHA=$(git rev-parse HEAD)
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${STATIC_BRANCH}"
          echo "sha=${STATIC_SHA}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify executable dev preview
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUILD_SHA: ${{ needs.publish.outputs.build_sha }}
      STATIC_SHA: ${{ needs.publish.outputs.static_sha }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Validate immutable HTML and bundle delivery
        run: |
          PREVIEW_URL="https://cdn.githubraw.com/${GITHUB_REPOSITORY}/${STATIC_SHA}/index.html"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --dump-header /tmp/preview.headers \
              "${PREVIEW_URL}" --output /tmp/preview.html \
              && grep --quiet "vdm-preview-commit.*${BUILD_SHA}" /tmp/preview.html \
              && grep --quiet '<div id="root"></div>' /tmp/preview.html; then
              break
            fi
            sleep 4
          done
          grep -Ei '^content-type:.*text/html' /tmp/preview.headers
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" /tmp/preview.html
          grep --quiet 'window.location.hash' /tmp/preview.html
          ASSET_PATH=$(grep -o 'src="\./assets/[^"]*\.js"' /tmp/preview.html | head -1 | cut -d'"' -f2)
          test -n "${ASSET_PATH}"
          ASSET_URL="${PREVIEW_URL%/index.html}/${ASSET_PATH#./}"
          curl --fail --silent --show-error --dump-header /tmp/asset.headers "${ASSET_URL}" --output /tmp/main.js
          grep -Ei '^content-type:.*(javascript|ecmascript)' /tmp/asset.headers
          test -s /tmp/main.js

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify real Home and public navigation
        run: node scripts/verify-static-preview.mjs

      - name: Upload preview audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-preview-audit-${{ needs.publish.outputs.build_sha }}
          path: artifacts/preview-audit
          if-no-files-found: warn
          retention-days: 14
