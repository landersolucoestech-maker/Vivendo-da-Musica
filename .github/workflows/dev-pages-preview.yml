name: Dev Preview Artifact

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-preview-artifact
  cancel-in-progress: true

jobs:
  cleanup-legacy-preview-branch:
    name: Remove legacy preview branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete dev-preview-static if present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/delete-response.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/git/refs/heads/dev-preview-static")"
          if [ "$status" != "204" ] && [ "$status" != "422" ]; then
            cat /tmp/delete-response.json
            echo "Failed deleting dev-preview-static: HTTP ${status}" >&2
            exit 1
          fi
          echo "Legacy preview branch deleted or already absent."

  build:
    name: Build dev preview artifact
    needs: cleanup-legacy-preview-branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: ./
      VITE_ROUTER_MODE: browser
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve build commit
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build

      - name: Stamp build and fallback document
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          stamp = f'<meta name="vdm-preview-commit" content="{os.environ["BUILD_SHA"]}" />'
          html = html.replace('<head>', f'<head>\n    {stamp}', 1)
          index.write_text(html, encoding='utf-8')
          Path('dist/404.html').write_text(html, encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" dist/index.html
          grep --quiet '<div id="root"></div>' dist/index.html

      - name: Upload compiled preview
        uses: actions/upload-artifact@v7
        with:
          name: dev-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
