name: Dev Static Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-static-preview-${{ github.event_name }}
  cancel-in-progress: true

env:
  STATIC_BRANCH: dev-preview-static
  STORAGE_ROOT: https://ywirfqvobfnunlcsnptm.supabase.co/storage/v1/object/public/vivendo-preview/builds
  STATIC_PUBLISH_URL: https://ywirfqvobfnunlcsnptm.supabase.co/functions/v1/vivendo-preview
  STATIC_ASSET_BASE: https://cdn.jsdelivr.net/gh/landersolucoestech-maker/Vivendo-da-Musica@dev-preview-static/

jobs:
  publish:
    name: Build and publish dev preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_sha: ${{ steps.resolve.outputs.sha }}
    env:
      VITE_SUPABASE_URL: https://ywirfqvobfnunlcsnptm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Oi717_T80P5TFfreKGATEg_qL1bEaVf
      VITE_DISABLE_AUTH: "true"
      VITE_PREVIEW_MODE: "true"
      VITE_USE_MOCK_DATA: "false"
      VITE_BASE_PATH: https://cdn.jsdelivr.net/gh/landersolucoestech-maker/Vivendo-da-Musica@dev-preview-static/
      VITE_ROUTER_MODE: hash
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Resolve build commit
        id: resolve
        run: |
          BUILD_SHA=$(git rev-parse HEAD)
          echo "BUILD_SHA=${BUILD_SHA}" >> "${GITHUB_ENV}"
          echo "sha=${BUILD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build hosted preview
        run: npm run build

      - name: Stamp build and add fallback
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          index = Path('dist/index.html')
          content = index.read_text(encoding='utf-8')
          stamp = f'<meta name="vdm-preview-commit" content="{os.environ["BUILD_SHA"]}" />'
          content = content.replace('<head>', '<head>\n    ' + stamp, 1)
          index.write_text(content, encoding='utf-8')
          Path('dist/404.html').write_text(content, encoding='utf-8')
          Path('dist/.nojekyll').touch()
          PY

      - name: Validate compiled document
        run: |
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" dist/index.html
          grep --quiet 'https://cdn.jsdelivr.net/gh/landersolucoestech-maker/Vivendo-da-Musica@dev-preview-static/assets/' dist/index.html
          grep --quiet '<div id="root"></div>' dist/index.html

      - name: Upload compiled preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-static-preview-${{ steps.resolve.outputs.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish static branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init --initial-branch="${STATIC_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(preview): publish ${BUILD_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${STATIC_BRANCH}"

      - name: Publish immutable HTML to Supabase Storage
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${STATIC_PUBLISH_URL}?publish=1&commit=${BUILD_SHA}" \
              --output /tmp/publish.json \
              && grep --quiet '"ok":true' /tmp/publish.json \
              && grep --quiet "${BUILD_SHA}" /tmp/publish.json; then
              cat /tmp/publish.json
              exit 0
            fi
            cat /tmp/publish.json 2>/dev/null || true
            sleep 4
          done
          echo "Não foi possível publicar o HTML imutável do preview." >&2
          exit 1

  verify:
    name: Verify published dev preview
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_SHA: ${{ needs.publish.outputs.build_sha }}
      STORAGE_ROOT: https://ywirfqvobfnunlcsnptm.supabase.co/storage/v1/object/public/vivendo-preview/builds
      STATIC_PUBLISH_URL: https://ywirfqvobfnunlcsnptm.supabase.co/functions/v1/vivendo-preview
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Validate Storage document and bundle MIME
        run: |
          PREVIEW_URL="${STORAGE_ROOT}/${BUILD_SHA}/index.html"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "${GITHUB_ENV}"
          curl --fail --silent --show-error --dump-header /tmp/preview.headers \
            "${PREVIEW_URL}" --output /tmp/preview.html
          grep -Ei '^content-type:.*text/html' /tmp/preview.headers
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" /tmp/preview.html
          grep --quiet '<div id="root"></div>' /tmp/preview.html
          ASSET_URL=$(grep -o 'src="https://cdn.jsdelivr.net/[^"]*\.js"' /tmp/preview.html | head -1 | cut -d'"' -f2)
          test -n "${ASSET_URL}"
          curl --fail --silent --show-error --dump-header /tmp/asset.headers "${ASSET_URL}" --output /tmp/main.js
          grep -Ei '^content-type:.*(javascript|ecmascript)' /tmp/asset.headers
          test -s /tmp/main.js

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify visible Home and hash navigation
        run: |
          mkdir -p artifacts/preview-audit
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const url = process.env.PREVIEW_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          const failedAssets = [];
          const consoleErrors = [];

          page.on('pageerror', (error) => pageErrors.push(error.message));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('requestfailed', (request) => {
            if (['script', 'stylesheet', 'document'].includes(request.resourceType())) {
              failedAssets.push(`${request.resourceType()} ${request.url()} — ${request.failure()?.errorText ?? 'failed'}`);
            }
          });

          let status = 0;
          let navigationError = null;
          try {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45_000 });
            status = response?.status() ?? 0;
            await page.waitForFunction(
              () => document.querySelector('#root')?.childElementCount > 0,
              undefined,
              { timeout: 30_000 },
            );
            await page.waitForTimeout(2_000);
          } catch (error) {
            navigationError = error instanceof Error ? error.message : String(error);
          }

          const beforeNavigation = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body.innerText.trim(),
            rootChildCount: document.querySelector('#root')?.childElementCount ?? 0,
            scriptCount: Array.from(document.scripts).filter((script) => Boolean(script.src)).length,
            stylesheetCount: document.querySelectorAll('link[rel="stylesheet"]').length,
            path: window.location.pathname,
            hash: window.location.hash,
            commit: document.querySelector('meta[name="vdm-preview-commit"]')?.getAttribute('content') ?? '',
          }));

          await page.evaluate(() => {
            window.location.hash = '#/cursos';
          });
          await page.waitForFunction(() => window.location.hash === '#/cursos', undefined, { timeout: 10_000 });
          await page.waitForTimeout(1_000);
          const afterNavigation = await page.evaluate(() => ({
            hash: window.location.hash,
            bodyText: document.body.innerText.trim(),
            rootChildCount: document.querySelector('#root')?.childElementCount ?? 0,
          }));

          await page.screenshot({ path: 'artifacts/preview-audit/home.png', fullPage: true });
          const report = {
            url,
            status,
            navigationError,
            ...beforeNavigation,
            bodyTextLength: beforeNavigation.bodyText.length,
            afterNavigation,
            pageErrors,
            failedAssets,
            consoleErrors,
          };
          await writeFile('artifacts/preview-audit/report.json', JSON.stringify(report, null, 2));

          const failures = [];
          if (navigationError) failures.push(navigationError);
          if (status !== 200) failures.push(`HTTP ${status}`);
          if (beforeNavigation.commit !== process.env.BUILD_SHA) failures.push(`Build inesperado: ${beforeNavigation.commit}`);
          if (beforeNavigation.rootChildCount === 0) failures.push('React não montou conteúdo no #root.');
          if (beforeNavigation.bodyText.length < 100) failures.push(`Conteúdo visível insuficiente: ${beforeNavigation.bodyText.length} caracteres.`);
          if (beforeNavigation.scriptCount === 0 || beforeNavigation.stylesheetCount === 0) failures.push('Bundles JavaScript ou CSS ausentes.');
          if (beforeNavigation.bodyText.includes('Não foi possível abrir a plataforma')) failures.push('Fallback fatal de inicialização foi exibido.');
          if (beforeNavigation.bodyText.includes('Carregando Vivendo da Música')) failures.push('Aplicação permaneceu presa no bootstrap.');
          if (afterNavigation.hash !== '#/cursos' || afterNavigation.rootChildCount === 0) failures.push('Navegação interna por hash falhou.');
          if (pageErrors.length > 0) failures.push(`Erros JavaScript: ${pageErrors.join(' | ')}`);
          if (failedAssets.length > 0) failures.push(`Assets críticos falharam: ${failedAssets.join(' | ')}`);

          await browser.close();
          console.log(JSON.stringify(report, null, 2));
          if (failures.length > 0) throw new Error(failures.join('\n'));
          JS

      - name: Verify stable public redirect
        run: |
          curl --fail --silent --show-error --location \
            "${STATIC_PUBLISH_URL}" --output /tmp/redirected.html
          grep --quiet "vdm-preview-commit.*${BUILD_SHA}" /tmp/redirected.html

      - name: Upload preview audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-preview-audit-${{ needs.publish.outputs.build_sha }}
          path: artifacts/preview-audit
          if-no-files-found: error
          retention-days: 14
