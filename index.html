<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <script>
      (() => {
        if (!window.location.hostname.endsWith('github.io')) return;

        const basePath = '/Vivendo-da-Musica';
        const { pathname, hash } = window.location;
        let targetHash = hash;

        if (!targetHash || targetHash === '#') {
          const deepPath = pathname.startsWith(basePath)
            ? pathname.slice(basePath.length) || '/'
            : '/';
          targetHash = `#${deepPath.startsWith('/') ? deepPath : `/${deepPath}`}`;
        }

        const normalizedPath = `${basePath}/${targetHash}`;
        const currentPath = `${pathname}${window.location.search}${hash}`;

        if (currentPath !== normalizedPath) {
          window.history.replaceState(null, '', normalizedPath);
        }
      })();
    </script>

    <title>Vivendo da Música</title>
    <meta
      name="description"
      content="Plataforma brasileira de formação, produtos digitais e desenvolvimento profissional para o mercado da música."
    />
    <meta name="author" content="Vivendo da Música" />

    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Vivendo da Música" />
    <meta
      property="og:description"
      content="Formação, produtos digitais e desenvolvimento profissional para o mercado da música."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vivendo da Música" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vivendo da Música" />
    <meta
      name="twitter:description"
      content="Formação, produtos digitais e desenvolvimento profissional para o mercado da música."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
